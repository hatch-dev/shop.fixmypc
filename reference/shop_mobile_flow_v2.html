<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>shop.fixmypc.ie — full mobile flow</title>
<meta name="robots" content="noindex,nofollow">
<style>
/* ============================================================================
   FixMyPC Shop — full mobile flow v1
   Home → menu → catalog → filters → search → product → cart → checkout →
   confirmation → account. One file, no dependencies, no <a> tags.
   ========================================================================== */
:root{
  --ink:#16174A;--ink-soft:#3A3C6E;--brand:#2D2DA0;--brand-700:#22227E;--brand-50:#F1F1FC;
  --go:#00A24A;--go-700:#00873E;--wash:#F7F7FD;--line:#E8E9F5;--line-strong:#CFD1E8;
  --muted:#6B7191;--danger:#C8324B;--amber:#B26A00;--star:#F0A500;
  --radius:14px;--radius-lg:20px;
  --shadow-sm:0 1px 3px rgba(22,23,74,.07);--shadow-md:0 10px 28px rgba(22,23,74,.12);
  --shadow-up:0 -6px 24px rgba(22,23,74,.12);
  --sans:"Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --tab-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#EFEFF6;font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid rgba(45,45,160,.35);outline-offset:2px;border-radius:8px}
.phone{max-width:402px;margin:0 auto;background:#fff;min-height:100dvh;position:relative;overflow:hidden}
@media (min-width:760px){
  body{padding:24px 0}
  .phone{border-radius:36px;box-shadow:0 30px 80px rgba(22,23,74,.28);height:calc(100dvh - 48px);overflow:hidden;
    border:1px solid #DCDDEC;transform:translateZ(0)}
  .scroller{height:100%;overflow-y:auto;overscroll-behavior:contain}
}
.scroller{padding-bottom:calc(var(--tab-h) + 20px);background:#fff}

/* ── chrome ── */
.promo{background:#DDE0FA;font-size:11.5px;font-weight:700;padding:7px 13px;display:flex;align-items:center;gap:8px}
.promo .chip{background:#fff;border-radius:999px;padding:3px 9px;font-size:11px;white-space:nowrap}
.promo .off{color:var(--go)}
.promo button{margin-left:auto;background:none;border:0;color:var(--ink-soft);font-size:15px;line-height:1;padding:0 2px}
.head{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:9px 10px;min-height:56px}
.hbtn{width:38px;height:38px;border-radius:11px;border:0;background:none;display:grid;place-items:center;color:var(--ink-soft);position:relative;flex:0 0 auto}
.hbtn:active{background:var(--brand-50)}
.hbtn .n{position:absolute;top:2px;right:2px;background:var(--go);color:#fff;font-size:9.5px;font-weight:800;
  min-width:16px;height:16px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
.head .mark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:-.01em;background:none;border:0;padding:0;color:var(--ink)}
.head .mark i{width:32px;height:32px;border-radius:9px;background:var(--brand);display:grid;place-items:center;font-style:normal}
.head .ht{flex:1;min-width:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbar{display:flex;align-items:center;gap:9px;border:1px solid var(--line-strong);border-radius:999px;padding:10px 14px;
  color:var(--muted);font-size:14px;background:#fff;width:100%;text-align:left;margin:12px 14px;width:calc(100% - 28px)}

/* ── tabs ── */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(255,255,255,.98);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));height:var(--tab-h)}
.tab{flex:1;border:0;background:none;display:grid;justify-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:700;position:relative}
.tab.on{color:var(--brand)}
.tab .n{position:absolute;top:-2px;right:22%;background:var(--go);color:#fff;font-size:9px;font-weight:800;
  min-width:15px;height:15px;border-radius:999px;display:grid;place-items:center;padding:0 3px}

/* ── generic ── */
.pad{padding:0 14px}
.sec{padding:20px 14px}
.sec.tint{background:var(--wash)}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-h h2{font-size:17px;margin:0;letter-spacing:-.02em}
.sec-h button{margin-left:auto;background:none;border:0;color:var(--brand);font-weight:700;font-size:13px}
.sub{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.btn{border:0;border-radius:999px;padding:13px 18px;font-size:15px;font-weight:700;width:100%;transition:.15s}
.btn-go{background:var(--go);color:#fff;box-shadow:0 6px 16px rgba(0,162,74,.24)}
.btn-go:active{background:var(--go-700)}
.btn-ink{background:var(--brand);color:#fff}
.btn-ink:active{background:var(--brand-700)}
.btn-ghost{background:#fff;border:1px solid var(--line-strong);color:var(--ink)}
.btn-sm{padding:9px 14px;font-size:13px;width:auto}
.btn[disabled]{opacity:.45;box-shadow:none}
.stars{color:var(--star);letter-spacing:.5px;font-size:12px}
.dim{color:var(--line-strong)}

/* ── hero ── */
.hero{position:relative;margin:12px 0 4px}
.hero-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding:0 14px;scrollbar-width:none}
.hero-track::-webkit-scrollbar{display:none}
.slide{flex:0 0 calc(100% - 28px);scroll-snap-align:center;border-radius:var(--radius-lg);padding:20px;min-height:158px;
  display:flex;flex-direction:column;justify-content:flex-end;color:#fff;position:relative;overflow:hidden}
.slide.a{background:linear-gradient(135deg,#2D2DA0,#6E6EDB)}
.slide.b{background:linear-gradient(135deg,#0B6B3A,#00A24A)}
.slide.c{background:linear-gradient(135deg,#3A2170,#8A4BD8)}
.slide .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:7px}
.slide b{font-size:20px;line-height:1.2;letter-spacing:-.02em;display:block;margin-bottom:5px;max-width:16ch}
.slide small{font-size:12.5px;opacity:.85;display:block;margin-bottom:13px;max-width:26ch}
.slide .cta{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;align-self:flex-start}
.slide .ghost-art{position:absolute;right:-18px;top:-14px;opacity:.16;color:#fff}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dot{width:6px;height:6px;border-radius:999px;background:var(--line-strong);border:0;padding:0}
.dot.on{background:var(--brand);width:18px}

/* ── quick actions ── */
.quick{display:flex;gap:9px;padding:14px 14px 0;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qa{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:999px;
  background:#fff;padding:9px 14px 9px 10px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.qa i{width:26px;height:26px;border-radius:8px;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;font-style:normal}

/* ── category grid ── */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{background:none;border:0;padding:0;display:grid;justify-items:center;gap:6px}
.cat i{width:100%;aspect-ratio:1;border-radius:16px;background:var(--wash);border:1px solid var(--line);color:var(--brand);
  display:grid;place-items:center;font-style:normal}
.cat:active i{background:var(--brand-50);border-color:var(--brand)}
.cat span{font-size:11px;font-weight:600;color:var(--ink-soft);text-align:center;line-height:1.25}

/* ── product cards ── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .pcard{flex:0 0 156px;scroll-snap-align:start}
.pcard{position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;display:flex;flex-direction:column;text-align:left}
.pcard .pic{position:relative;aspect-ratio:1;background:var(--wash);display:grid;place-items:center;color:var(--brand)}
.pcard .pic svg{opacity:.34;width:52%;height:52%}
.pcard.out .pic{opacity:.55}
.pcard .flag{position:absolute;top:8px;left:8px;background:var(--go);color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px}
.pcard .flag.flash{background:var(--amber)}
.pcard .flag.out{background:var(--ink);opacity:.85}
.pcard .heart{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--muted)}
.pcard .heart.on{color:var(--danger);border-color:#EFC3CC}
.pcard .b{padding:10px 11px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.pcard .bl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pcard .pname{display:block;margin:0;font-size:12.8px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.pcard .rr{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.pcard .pr{display:flex;align-items:baseline;gap:7px;margin-top:auto;padding-top:4px}
.pcard .pr b{font-size:15px;letter-spacing:-.02em}
.pcard .pr s{font-size:11.5px;color:var(--muted)}
.pcard .act{padding:0 11px 11px}
.pcard .act .btn{padding:9px;font-size:12.5px}
.oos-note{font-size:11.5px;color:var(--muted);font-weight:700;display:block;padding:0 11px 11px}

/* ── trust ── */
.trust{display:grid;gap:9px}
.trow{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;background:#fff}
.trow i{width:32px;height:32px;border-radius:10px;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;flex:0 0 auto;font-style:normal}
.trow b{display:block;font-size:13.5px}
.trow small{color:var(--muted);font-size:12px}

/* ── catalog bits ── */
.filterbar{position:sticky;top:56px;z-index:25;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;gap:9px;padding:10px 14px}
.fb{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);border-radius:999px;
  background:#fff;padding:10px;font-size:13.5px;font-weight:700;color:var(--ink)}
.fb .n{background:var(--brand);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:999px;display:grid;place-items:center;padding:0 5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:#fff;
  border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .n{font-size:11px;font-weight:800;background:var(--wash);border-radius:999px;padding:1px 7px;color:var(--muted)}
.chip.on .n{background:rgba(255,255,255,.22);color:#fff}
.applied{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px 0}
.ap{display:inline-flex;align-items:center;gap:7px;background:var(--brand-50);border:1px solid #D5D6F5;color:var(--brand);
  border-radius:999px;padding:5px 8px 5px 12px;font-size:12px;font-weight:700}
.ap span{width:16px;height:16px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:10px}
.crumb{display:flex;align-items:center;gap:7px;padding:12px 14px 0;font-size:12.5px;color:var(--muted)}
.crumb button{background:none;border:0;color:var(--brand);font:inherit;font-weight:600;padding:0}
.empty{margin:16px 14px;border:1px dashed var(--line-strong);border-radius:var(--radius-lg);padding:34px 20px;text-align:center;background:var(--wash)}
.empty b{display:block;font-size:16px;margin-bottom:6px}
.empty p{margin:0 0 16px;color:var(--muted);font-size:13.5px}

/* ── sheets and drawer ── */
.scrim{position:fixed;inset:0;background:rgba(22,23,74,.42);opacity:0;pointer-events:none;transition:opacity .22s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:65;background:#fff;border-radius:22px 22px 0 0;
  transform:translateY(100%);transition:transform .26s ease;display:flex;flex-direction:column;max-height:88dvh}
.sheet.on{transform:none}
/* Inside the phone frame every fixed child must anchor to the frame, not the
   viewport. The transform on .phone makes it the containing block, and the
   explicit list is the belt to that braces. */
@media (min-width:760px){
  .sheet,.scrim,.drawer,.overlay,.toasts,.tabs,.bar{position:absolute!important}
  .sheet{max-height:88%}
}
.sheet-h{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-h b{font-size:16px;flex:1}
.sheet-h .grab{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:999px;background:var(--line-strong)}
.sheet-b{overflow:auto;padding:4px 18px 18px;flex:1}
.sheet-f{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-f .btn{flex:1}
.fgroup{padding:16px 0;border-bottom:1px solid var(--line)}
.fgroup:last-child{border-bottom:0}
.fgroup h4{margin:0 0 11px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;display:flex}
.fgroup h4 button{margin-left:auto;background:none;border:0;color:var(--brand);font-size:12px;font-weight:700;letter-spacing:0;text-transform:none}
.frow{display:flex;align-items:center;gap:11px;padding:9px 2px;font-size:14px;color:var(--ink-soft)}
.frow input{width:19px;height:19px;accent-color:var(--brand);margin:0;flex:0 0 auto}
.frow .n{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:700}
.prow{display:flex;gap:9px;align-items:center}
.prow .cur{flex:1;display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:11px;overflow:hidden}
.prow .cur i{padding:0 10px;color:var(--muted);font-style:normal;background:var(--wash);align-self:stretch;display:grid;place-items:center;font-size:13px}
.prow input{border:0;padding:11px 12px;width:100%;min-width:0;font-family:inherit;font-size:14px}
.prow input:focus{outline:none}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.pill.on{background:var(--brand);border-color:var(--brand);color:#fff}

.drawer{position:fixed;top:0;bottom:0;right:0;width:330px;max-width:90vw;background:#fff;z-index:66;transform:translateX(100%);
  transition:transform .26s ease;display:flex;flex-direction:column;box-shadow:var(--shadow-md)}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dr-b{flex:1;overflow:auto;padding:8px 12px 16px}
.dr-row{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;padding:12px 10px;border-radius:12px;
  font-size:14.5px;font-weight:600;color:var(--ink);text-align:left}
.dr-row:active{background:var(--brand-50)}
.dr-row i{width:32px;height:32px;border-radius:10px;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;flex:0 0 auto;font-style:normal}
.dr-row .cv{margin-left:auto;color:var(--muted);transition:transform .2s}
.dr-row.open .cv{transform:rotate(180deg)}
.dr-kids{display:none;margin:0 0 6px 52px;border-left:1px solid var(--line);padding-left:10px}
.dr-kids.on{display:block}
.dr-kid{display:flex;width:100%;background:none;border:0;padding:9px 10px;border-radius:9px;font-size:13.5px;color:var(--ink-soft);text-align:left}
.dr-kid:active{background:var(--brand-50)}
.dr-cap{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:16px 10px 6px}
.dr-f{border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.dr-f button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-soft)}

.overlay{position:fixed;inset:0;background:#fff;z-index:67;display:none;flex-direction:column}
.overlay.on{display:flex}
.ov-h{display:flex;align-items:center;gap:10px;padding:12px 12px;border-bottom:1px solid var(--line)}
.ov-h input{flex:1;border:1px solid var(--line-strong);border-radius:999px;padding:11px 15px;font-size:15px;font-family:inherit}
.ov-b{flex:1;overflow:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
.sug{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;padding:12px 4px;font-size:14.5px;color:var(--ink);
  text-align:left;border-bottom:1px solid var(--line)}
.sug i{color:var(--muted);font-style:normal;display:grid;place-items:center}
.sug small{margin-left:auto;color:var(--muted);font-size:12px}

/* ── product page ── */
.gal{position:relative;background:var(--wash)}
.gtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gtrack::-webkit-scrollbar{display:none}
.gslide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:1;display:grid;place-items:center}
.gslide svg{width:54%;height:54%;color:var(--brand);opacity:.34}
.gcount{position:absolute;right:12px;bottom:12px;background:rgba(22,23,74,.72);color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.pbuy{border:1px solid var(--line);border-radius:var(--radius);padding:13px;margin:14px 0}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price b{font-size:26px;letter-spacing:-.03em}
.price s{color:var(--muted);font-size:14px}
.save{background:#EAF9F0;color:#0B6B3A;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.deliv{display:grid;gap:7px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line-strong);font-size:12.5px;color:var(--ink-soft)}
.deliv div{display:flex;gap:8px}
.deliv svg{flex:0 0 auto;color:var(--brand);margin-top:1px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:999px}
.stepper button{width:40px;height:44px;border:0;background:none;font-size:18px;color:var(--ink-soft)}
.stepper span{width:30px;text-align:center;font-weight:700}
.acc{border-bottom:1px solid var(--line)}
.acc-h{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:15px 2px;text-align:left;font-size:14.5px;font-weight:700}
.acc-h .cv{margin-left:auto;color:var(--muted);transition:transform .2s}
.acc.on .cv{transform:rotate(180deg)}
.acc-b{display:none;padding:0 2px 16px;font-size:13.5px;color:var(--ink-soft);line-height:1.6}
.acc.on .acc-b{display:block}

/* ── cart / checkout ── */
.line{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .pic{width:60px;height:60px;border-radius:12px;background:var(--wash);display:grid;place-items:center;color:var(--brand);flex:0 0 auto}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-size:13px;font-weight:600;line-height:1.35}
.line .t small{color:var(--muted);font-size:11.5px}
.line .pr{font-weight:800;font-size:14px;white-space:nowrap}
.sum{border:1px solid var(--line);border-radius:var(--radius);padding:13px;margin-top:14px;background:var(--wash)}
.sum-line{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);padding:4px 0}
.sum-line b{color:var(--ink)}
.sum-total{border-top:1px solid var(--line-strong);margin-top:8px;padding-top:10px;font-size:16px;font-weight:800}
.choice{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--line-strong);border-radius:var(--radius);
  padding:12px;background:#fff;width:100%;text-align:left;margin-bottom:9px}
.choice.on{border-color:var(--brand);background:var(--brand-50)}
.choice .dt{width:19px;height:19px;border-radius:50%;border:2px solid var(--line-strong);flex:0 0 auto;margin-top:1px;position:relative}
.choice.on .dt{border-color:var(--go)}
.choice.on .dt:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--go)}
.choice .t{flex:1;min-width:0}
.choice .t b{display:block;font-size:13.5px}
.choice .t small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.choice .pr{font-size:13px;font-weight:800}
.choice .pr.free{color:var(--go)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.control{width:100%;border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;color:var(--ink)}
.control:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(45,45,160,.10);outline:none}
.control.bad{border-color:var(--danger)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted);margin:5px 0 0}

/* ── sticky action bar ── */
.bar{position:fixed;left:0;right:0;bottom:var(--tab-h);z-index:44;background:rgba(255,255,255,.98);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);box-shadow:var(--shadow-up);padding:10px 14px;display:none;gap:12px;align-items:center}
.bar.on{display:flex}
.bar .bp b{font-size:17px;letter-spacing:-.02em;display:block;line-height:1.15}
.bar .bp small{font-size:11px;color:var(--muted)}
.bar .btn{flex:1}
.bar-why{position:absolute;left:14px;right:14px;top:-22px;font-size:11.5px;color:var(--amber);font-weight:700;text-align:center}

/* ── account ── */
.acct-head{background:linear-gradient(135deg,#2D2DA0,#5A5AD0);color:#fff;padding:22px 16px 26px}
.acct-head b{font-size:19px;display:block}
.acct-head small{opacity:.85;font-size:13px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-18px;padding:0 14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 13px;text-align:left;box-shadow:var(--shadow-sm)}
.tile i{width:32px;height:32px;border-radius:10px;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;font-style:normal;margin-bottom:9px}
.tile b{display:block;font-size:14px}
.tile small{color:var(--muted);font-size:12px}
.list-row{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;padding:14px 4px;border-bottom:1px solid var(--line);
  font-size:14.5px;color:var(--ink);text-align:left}
.list-row .cv{margin-left:auto;color:var(--muted)}

.done-wrap{padding:28px 18px 6px;text-align:center}
.done-ic{width:66px;height:66px;border-radius:20px;background:#EAF9F0;display:grid;place-items:center;margin:0 auto 16px}
.done-wrap h2{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
.done-wrap p{margin:0 0 16px;color:var(--muted);font-size:14px}
.tl{display:flex;gap:12px;padding-bottom:15px;position:relative;text-align:left}
.tl:last-child{padding-bottom:0}
.tl:before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl:last-child:before{display:none}
.tl i{width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--muted);display:grid;place-items:center;flex:0 0 auto;font-style:normal;z-index:1}
.tl.on i{background:var(--go);color:#fff}
.tl b{display:block;font-size:13.5px}
.tl small{color:var(--muted);font-size:12px}

.footer{background:var(--brand);color:#fff;padding:22px 16px 26px;margin-top:8px}
.footer b{font-size:16px;display:block;margin-bottom:5px}
.footer p{margin:0 0 14px;font-size:12.5px;opacity:.85}
.footer .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:12.5px;opacity:.9;margin-bottom:16px}
.footer .cols u{display:block;margin-bottom:6px;font-weight:800;text-decoration:none;opacity:.7;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.footer .cols button{display:block;background:none;border:0;color:#fff;opacity:.85;font-size:12.5px;padding:3px 0;text-align:left}
.footer small{font-size:11px;opacity:.7}

.screen{display:none}.screen.on{display:block}
.toasts{position:fixed;left:14px;right:14px;bottom:calc(var(--tab-h) + 14px);z-index:70;display:grid;gap:8px}
.toast{background:var(--ink);color:#fff;padding:12px 15px;border-radius:12px;font-size:13px;box-shadow:var(--shadow-md)}
.toast.go{background:#0B6B3A}.toast.bad{background:#8E2035}
.note-strip{margin:12px 14px 0;background:var(--brand-50);border:1px solid #D9DAF7;border-radius:var(--radius);
  padding:11px 13px;font-size:12px;color:var(--ink-soft);display:flex;gap:9px}
.note-strip b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

  /* ══════════ CATALOG ══════════ */
  function results(){
    var out = P.filter(function(p){
      if (S.cat && p.cat !== S.cat) return false;
      if (S.sub && p.sub !== S.sub) return false;
      if (S.brands.length && S.brands.indexOf(p.brand) < 0) return false;
      if (S.rating && p.rating < S.rating) return false;
      if (S.min != null && p.price < S.min) return false;
      if (S.max != null && p.price > S.max) return false;
      if (S.stockOnly && !p.stock) return false;
      if (S.dealOnly && p.was <= p.price) return false;
      if (S.q){
        var q = S.q.toLowerCase();
        if (p.name.toLowerCase().indexOf(q) < 0 && p.brand.toLowerCase().indexOf(q) < 0) return false;
      }
      return true;
    });
    var by = {low:function(a,b){return a.price-b.price;}, high:function(a,b){return b.price-a.price;},
              rating:function(a,b){return b.rating-a.rating || b.reviews-a.reviews;},
              featured:function(a,b){return (b.stock-a.stock) || (b.reviews-a.reviews);}};
    return out.sort(by[S.sort] || by.featured);
  }

        else if (k === 'deal') S.dealOnly = false;
        render();

  /* ══════════ sticky bar ══════════ */
  function paintBar(){
    var bar = $('bar'), show = false, label = '', sub = '', why = '';
    if (S.screen === 'cart' && CART.length){ show = true; label = 'Checkout'; sub = cartCount() + ' items'; }
    else if (S.screen === 'checkout'){
      show = true;
      label = {card:'Pay ' + money(total()), applepay:'Pay with Apple Pay', paypal:'Continue to PayPal', bank:'Get transfer details'}[CO.pay];
      sub = CO.fulfil === 'collect' ? 'Collecting in Kilcock' : 'Delivered Saturday';
      if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(CO.email)) why = 'Add the email for your receipt';
      else if (CO.phone.replace(/\D/g, '').length < 7) why = 'Add a mobile number for the courier';
    }
    else if (S.screen === 'product'){
      var p = P.filter(function(x){ return x.id === S.product; })[0];
      if (p && p.stock){ show = true; label = 'Add to basket'; sub = 'Qty ' + pQty; }
    }
    bar.classList.toggle('on', show);
    if (!show) return;
    $('bar-total').textContent = S.screen === 'product'
      ? money((P.filter(function(x){ return x.id === S.product; })[0] || {price:0}).price * pQty)
      : money(total());
    $('bar-sub').textContent = sub;
    $('bar-cta').textContent = label;
    $('bar-cta').disabled = !!why;
    var w = bar.querySelector('.bar-why');
    if (why){
      if (!w){ w = document.createElement('p'); w.className = 'bar-why'; bar.appendChild(w); }
      w.textContent = why;
    } else if (w) w.remove();
  }
  $('bar-cta').onclick = function(){
    if (S.screen === 'cart') go('checkout');
    else if (S.screen === 'product'){
      var p = P.filter(function(x){ return x.id === S.product; })[0];
      if (p) addToCart(p.id, pQty);
    }
    else if (S.screen === 'checkout'){
      var btn = this, old = btn.textContent;
      btn.disabled = true; btn.textContent = 'Authorising…';
      setTimeout(function(){
        btn.disabled = false; btn.textContent = old;
        CART = []; go('done');
      }, 900);
    }
  };

  /* ══════════ render ══════════ */
  function render(){
    paintHead(); paintTabs();
    if (S.screen === 'home') paintHome();
    else if (S.screen === 'catalog') paintCatalog();
    else if (S.screen === 'product') paintProduct();
    else if (S.screen === 'cart') paintCart();
    else if (S.screen === 'checkout') paintCheckout();
    else if (S.screen === 'done') paintDone();
    else if (S.screen === 'account') paintAccount();
    paintBar();
  }
  $('promo-x').onclick = function(){ $('promo').remove(); };
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ closeSheets(); $('sx').onclick(); } });
  render();
})();
</script>
</body>
</html>
